<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Banner Generator - MineToolsX</title><meta name="description" content="Layer multiple banner patterns and generate a Java give command."><link rel="canonical" href="https://minetools.io/banner.html"><link rel="stylesheet" href="/styles.css"><meta property="og:type" content="website"><meta property="og:title" content="Minecraft Banner Generator - MineToolsX"><meta property="og:description" content="Layer multiple banner patterns and generate a Java give command."><meta property="og:url" content="https://minetools.io/banner.html"><meta name="twitter:card" content="summary"></head><body><header class="site-header"><div class="pixel-bg"></div><button class="menu-btn" id="menuBtn">☰</button><a class="logo" href="/"><div class="logo-top">MINECRAFT</div><div class="logo-bottom">TO⚙LS<span>X</span></div></a></header><div class="tool-layout"><aside class="sidebar" id="sidebar"><div class="side-title">COMMUNITY CONTENT</div><nav id="toolNav"></nav></aside><main class="tool-main"><h1>Minecraft Banner Generator</h1><h2>Layer multiple banner patterns and generate a Java give command.</h2><section class="panel"><div class="form-grid"><div class="field"><label>Base color</label><select id="base"><option>white</option><option>black</option><option>red</option><option>blue</option><option>green</option><option>yellow</option><option>purple</option><option>orange</option></select></div><div class="field"><label>Custom name</label><input id="bname" value="MineToolsX Banner"></div></div><h3>Pattern layers</h3><div id="layers"></div><div class="actions"><button class="btn secondary" id="addLayer">+ ADD LAYER</button></div><div id="banprev" class="banner-preview"><div class="banner-cloth" id="cloth">⚑</div></div><h3>Command</h3><div id="banout" class="output"></div><div class="actions"><button class="btn" onclick="copyText('banout')">COPY COMMAND</button></div></section></main></div><footer><a href="/">Home</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a><small>Not affiliated with Mojang Studios or Microsoft.</small></footer><script src="/tools.js"></script><script>const patterns=[["minecraft:stripe_center","Stripe center"],["minecraft:cross","Cross"],["minecraft:creeper","Creeper"],["minecraft:skull","Skull"],["minecraft:flower","Flower"],["minecraft:gradient","Gradient"],["minecraft:border","Border"],["minecraft:rhombus","Rhombus"]],colors=["black","white","red","blue","lime","yellow","purple","orange"];function add(){const d=document.createElement("div");d.className="layer-row";d.innerHTML='<select class="pat">'+patterns.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join("")+'</select><select class="col">'+colors.map(x=>'<option>'+x+'</option>').join("")+'</select><button class="remove">×</button>';layers.appendChild(d);d.querySelectorAll("select").forEach(x=>x.oninput=bc);d.querySelector(".remove").onclick=()=>{d.remove();bc()};bc()}function bc(){const ps=[...layers.querySelectorAll(".layer-row")].map(r=>'{pattern:"'+r.querySelector(".pat").value+'",color:"'+r.querySelector(".col").value+'"}');cloth.textContent="⚑ "+base.value.toUpperCase()+" · "+ps.length+" LAYERS";banout.textContent="/give @p minecraft:"+base.value+"_banner[minecraft:custom_name='"+JSON.stringify({text:bname.value})+"',minecraft:banner_patterns=["+ps.join(",")+"]] 1"}addLayer.onclick=add;base.oninput=bname.oninput=bc;add();</script></body></html>
