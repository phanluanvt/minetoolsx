<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Potion Generator & Give Command | MineToolsX</title><meta name="description" content="Create custom Java potion commands with effect, duration, amplifier, color and visibility options."><link rel="canonical" href="https://minetools.io/potion.html"><link rel="stylesheet" href="/styles.css"><meta property="og:title" content="Minecraft Potion Generator & Give Command | MineToolsX"><meta property="og:description" content="Create custom Minecraft potions with effects, duration, amplifier, color, particles and Java Edition commands."><meta property="og:type" content="website"><meta property="og:url" content="https://minetools.io/potion.html"></head><body><header class="site-header"><div class="pixel-bg"></div><button class="menu-btn" id="menuBtn">☰</button><a class="logo" href="/"><div class="logo-top">MINECRAFT</div><div class="logo-bottom">TO⚙LS<span>X</span></div></a></header><div class="tool-layout"><aside class="sidebar" id="sidebar"><div class="side-title">COMMUNITY CONTENT</div><nav id="toolNav"></nav></aside><main class="tool-main"><h1>Minecraft Potion Generator</h1><h2>Create custom Java potion commands with effect, duration, amplifier, color and visibility options.</h2><section class="panel"><div class="form-grid"><div class="field"><label>Potion type</label><select id="ptype"><option value="potion">Potion</option><option value="splash_potion">Splash Potion</option><option value="lingering_potion">Lingering Potion</option></select></div><div class="field"><label>Effect</label><select id="effect"><option>speed</option><option>strength</option><option>regeneration</option><option>night_vision</option><option>jump_boost</option><option>invisibility</option><option>poison</option><option>instant_health</option><option>fire_resistance</option><option>water_breathing</option></select></div><div class="field"><label>Duration (seconds)</label><input id="pdur" type="number" value="60" min="1"></div><div class="field"><label>Level</label><input id="plevel" type="number" value="1" min="1" max="256"></div><div class="field"><label>Custom name</label><input id="pname" value="MineToolsX Potion"></div><div class="field"><label>Potion color</label><input id="pcolor" type="color" value="#7f3fbf"></div></div><div class="checkline"><input id="particles" type="checkbox" checked><label>Show particles</label><input id="icon" type="checkbox" checked><label>Show icon</label><input id="ambient" type="checkbox"><label>Ambient</label></div><div id="potionPreview" class="preview-box">🧪 MineToolsX Potion</div><h3>Give command</h3><div id="pout" class="output"></div><div class="actions"><button class="btn" onclick="copyText('pout')">COPY COMMAND</button></div></section></main></div><footer><a href="/">Home</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a><small>Not affiliated with Mojang Studios or Microsoft.</small></footer><script src="/tools.js"></script><script>function pc(){const amp=Math.max(0,(+plevel.value||1)-1),dur=Math.round((+pdur.value||1)*20),color=parseInt(pcolor.value.slice(1),16);potionPreview.style.color=pcolor.value;potionPreview.textContent="🧪 "+(pname.value||"Custom Potion");pout.textContent="/give @p minecraft:"+ptype.value+"[minecraft:custom_name='"+JSON.stringify({text:pname.value})+"',minecraft:potion_contents={custom_color:"+color+",custom_effects:[{id:'minecraft:"+effect.value+"',amplifier:"+amp+",duration:"+dur+",ambient:"+ambient.checked+",show_particles:"+particles.checked+",show_icon:"+icon.checked+"}]}] 1"}document.querySelectorAll(".panel input,.panel select").forEach(e=>e.addEventListener("input",pc));pc();</script></body></html>
