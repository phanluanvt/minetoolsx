<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Mob Generator - MineToolsX</title><meta name="description" content="Build Java summon commands with common entity options, equipment and attributes."><link rel="canonical" href="https://minetoolsx.com/minecraft-mob-generator.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><div class="pixel-bg"></div><button class="menu-btn" id="menuBtn">☰</button><a class="logo" href="/"><div class="logo-top">MINECRAFT</div><div class="logo-bottom">TO⚙LS<span>X</span></div></a></header><div class="tool-layout"><aside class="sidebar" id="sidebar"><div class="side-title">COMMUNITY CONTENT</div><nav id="toolNav"></nav></aside><main class="tool-main"><h1>Minecraft Mob Generator</h1><h2>Build Java summon commands with common entity options, equipment and attributes.</h2><section class="panel"><div class="tool-tabs"><button class="chip active">Java</button><span class="version-pill">1.21+</span></div><div class="form-grid"><div class="field"><label>Mob</label><select id="mob"><option>zombie</option><option>skeleton</option><option>creeper</option><option>enderman</option><option>villager</option><option>pig</option><option>cow</option><option>warden</option><option>iron_golem</option></select></div><div class="field"><label>Custom name</label><input id="mname" value="MineToolsX Mob"></div><div class="field"><label>Health</label><input id="health" type="number" value="20" min="1"></div><div class="field"><label>Coordinates</label><input id="coords" value="~ ~ ~"></div><div class="field"><label>Main hand item</label><input id="hand" placeholder="minecraft:diamond_sword"></div><div class="field"><label>Movement speed</label><input id="speed" type="number" step=".01" placeholder="0.25"></div></div><div class="checkline"><input id="baby" type="checkbox"><label>Baby</label><input id="silent" type="checkbox"><label>Silent</label><input id="glow" type="checkbox"><label>Glowing</label><input id="invuln" type="checkbox"><label>Invulnerable</label><input id="persist" type="checkbox" checked><label>Persistent</label></div><h3>Summon command</h3><div id="moutput" class="output"></div><div class="actions"><button class="btn" onclick="copyText('moutput')">COPY COMMAND</button><button class="btn secondary" onclick="resetMob()">RESET</button></div></section></main></div><footer><a href="/">Home</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a><small>Not affiliated with Mojang Studios or Microsoft.</small></footer><script src="/tools.js"></script><script>function mc(){let n=[];if(mname.value)n.push("CustomName:'"+JSON.stringify({text:mname.value.replace(/'/g,"")})+"'");n.push("Health:"+(+health.value||20)+"f");if(baby.checked)n.push("IsBaby:1b");if(silent.checked)n.push("Silent:1b");if(glow.checked)n.push("Glowing:1b");if(invuln.checked)n.push("Invulnerable:1b");if(persist.checked)n.push("PersistenceRequired:1b");if(hand.value.trim())n.push('HandItems:[{id:"'+hand.value.trim()+'",count:1},{}]');if(speed.value)n.push('attributes:[{id:"minecraft:movement_speed",base:'+(+speed.value)+'}]');moutput.textContent="/summon minecraft:"+mob.value+" "+(coords.value||"~ ~ ~")+" {"+n.join(",")+"}"}function resetMob(){mname.value="MineToolsX Mob";health.value=20;coords.value="~ ~ ~";hand.value="";speed.value="";baby.checked=silent.checked=glow.checked=invuln.checked=false;persist.checked=true;mc()}document.querySelectorAll(".panel input,.panel select").forEach(e=>e.addEventListener("input",mc));mc();</script></body></html>
